<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#231a15">
<meta name="description" content="말없이 같이 누워 있는 온라인 찜질방, 온돌. 불가마의 불을 함께 지켜요.">
<title>온돌, 잠깐 누워가요</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  .boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; padding:24px; background:#231a15; color:#e9d8c0; font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; text-align:center; z-index:50; transition:opacity .6s ease; }
  .boot.is-hiding { opacity:0; pointer-events:none; }
  .boot svg { width:36px; height:36px; color:#ff8a3d; }
  .boot h1 { margin:0; font-size:26px; font-weight:500; letter-spacing:6px; padding-left:6px; }
  .boot p { margin:0; font-size:12px; color:#a8937a; line-height:1.7; }
  .boot-dot { width:5px; height:5px; margin-top:16px; border-radius:50%; background:#ff8a3d; animation:breathe 1.8s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity:.2; } }
  @media (prefers-reduced-motion:reduce) { .boot-dot { animation:none; } }
</style>
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<div id="app"></div>
<main id="boot" class="boot" role="status" aria-label="온돌">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3 4 4 4 8a4 4 0 0 1-8 0c0-1.5.6-2.5 1.5-3.5.3 1.2 1 2 2.5 2.5C12 8 11 5.5 12 3z"/><path d="M4 21h16"/></svg>
  <h1>온돌</h1>
  <p id="boot-message">찜질방 문을 여는 중</p>
  <span class="boot-dot" aria-hidden="true"></span>
</main>
<noscript><main style="padding:3rem;max-width:36rem;margin:auto;color:#e9d8c0;font-family:sans-serif;line-height:1.8"><h1>온돌 · 온라인 찜질방</h1><p>양머리 수건 쓰고, 불가마에서 버티고, 잠깐 누워가는 공간입니다.</p><p>들어오려면 브라우저의 JavaScript를 켜주세요.</p></main></noscript>
</body>
</html>
